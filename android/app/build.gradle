plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'dev.flutter.flutter-gradle-plugin'
}
android {
    namespace 'com.ziada.bydsmartlauncher'
    compileSdk flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    defaultConfig {
        applicationId 'com.ziada.bydsmartlauncher'
        minSdk 29
        targetSdk 29 // Needs review with DiLink OS 2602.
        versionCode flutter.versionCode
        versionName flutter.versionName
    }
    buildTypes {
        release {
            signingConfig signingConfigs.debug // DEV ONLY.
        }
    }
    // BC TLS/X509 libraries contain duplicate JPMS/OSGi metadata; not runtime assets.
    packaging {
        resources {
            excludes += ['META-INF/versions/**', 'META-INF/LICENSE.md', 'META-INF/NOTICE.md']
        }
    }
}
dependencies {
    // BYDMate v4.0.1 STLS pairing certificate generation.
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.85'
    testImplementation 'junit:junit:4.13.2'
}
flutter { source '../..' }
