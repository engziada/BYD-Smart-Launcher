plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'dev.flutter.flutter-gradle-plugin'
}
android {
    namespace 'com.ziada.bydsmartlauncher'
    compileSdk flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    defaultConfig {
        applicationId 'com.ziada.bydsmartlauncher'
        minSdk 29
        targetSdk 29 // Revisit after DiLink OS 2602 verification; mirrors BYDMate legacy energydata access.
        versionCode flutter.versionCode
        versionName flutter.versionName
    }
    buildTypes {
        release {
            signingConfig signingConfigs.debug // DEV ONLY. Never distribute production builds with debug key.
        }
    }
}
flutter { source '../..' }
