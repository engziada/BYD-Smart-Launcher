name: Flutter and Android checks
# Development branches do not trigger CI on every intermediate commit.
# Use draft PRs while implementing; the final ready-for-review event runs CI.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

# One active validation run per PR. Superseded PR checks are cancelled rather
# than producing obsolete red failures. Never cancel main/release jobs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
jobs:
  flutter:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Generate missing standard Android wrapper files
        run: flutter create --platforms=android --project-name byd_smart_launcher --org com.ziada .
      - name: Prepare checksummed Gradle and Kotlin build tools
        shell: bash
        run: |
          set -euo pipefail
          wrapper=android/gradle/wrapper/gradle-wrapper.properties
          archive="$RUNNER_TEMP/gradle-9.3.1-bin.zip"
          checksum=b266d5ff6b90eada6dc3b20cb090e3731302e553a27c5d3e4df1f0d76beaff06
          grep -Eq '^distributionUrl=.*gradle-9\.3\.1-(all|bin)\.zip$' "$wrapper"
          verify_archive() { printf '%s  %s\n' "$checksum" "$archive" | sha256sum --check; }
          if ! (curl -fLsS --max-time 60 https://services.gradle.org/distributions/gradle-9.3.1-bin.zip -o "$archive" && verify_archive); then
            curl -fLsS --max-time 60 https://mirrors.cloud.tencent.com/gradle/gradle-9.3.1-bin.zip -o "$archive"
            verify_archive
          fi
          sed -i -e '/^distributionUrl=/d' -e '/^distributionSha256Sum=/d' "$wrapper"
          printf '\ndistributionUrl=file://%s\ndistributionSha256Sum=%s\n' "$archive" "$checksum" >> "$wrapper"

          # Maven Central's compiler JAR redirect can time out on the runner.
          # Gradle bundles the identical artifact. Keep the original Maven POM.
          module=org/jetbrains/kotlin/kotlin-compiler-embeddable/2.2.21
          artifact=kotlin-compiler-embeddable-2.2.21
          repo="$RUNNER_TEMP/kotlin-build-tools"
          init_dir="${GRADLE_USER_HOME:-$HOME/.gradle}/init.d"
          mkdir -p "$repo/$module" "$init_dir"
          unzip -p "$archive" "gradle-9.3.1/lib/$artifact.jar" > "$repo/$module/$artifact.jar"
          curl -fLsS --max-time 30 "https://repo.maven.apache.org/maven2/$module/$artifact.pom" -o "$repo/$module/$artifact.pom"
          (cd "$repo/$module"; sha256sum --check <<'CHECKSUMS'
          9588fa696ac5507af764fd5660df6894185e12704ec1bc3f5cb772af4987f295  kotlin-compiler-embeddable-2.2.21.jar
          0b33c64f2622ba3bc8283378bdb7505f2be330a2275807038ad54359b33ddf9b  kotlin-compiler-embeddable-2.2.21.pom
          CHECKSUMS
          )
          cat > "$init_dir/byd-kotlin-compiler.gradle" <<'GRADLE'
          gradle.beforeSettings { settings ->
              settings.dependencyResolutionManagement.repositories.maven {
                  url = uri(new File(System.getenv('RUNNER_TEMP'), 'kotlin-build-tools'))
                  content { includeVersion('org.jetbrains.kotlin', 'kotlin-compiler-embeddable', '2.2.21') }
              }
          }
          GRADLE
      - name: Run native Android unit tests
        run: cd android && ./gradlew testDebugUnitTest --no-daemon
      - name: Compile Android debug APK (not production)
        run: flutter build apk --debug
      - name: Verify APK integrity, signature and package
        shell: bash
        run: |
          set -euo pipefail
          apk=build/app/outputs/flutter-apk/app-debug.apk
          test -s "$apk"
          bt="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$bt/apksigner" verify --min-sdk-version 29 "$apk"
          "$bt/aapt" dump badging "$apk" | grep -F "com.ziada.bydsmartlauncher"
          "$bt/aapt" dump xmltree "$apk" AndroidManifest.xml > /tmp/byd-apk-manifest.txt
          ! grep -F 'android.intent.category.HOME' /tmp/byd-apk-manifest.txt
          version_line="$(awk '/^version: / {print $2}' pubspec.yaml)"
          if [[ ! "$version_line" =~ ^([0-9]+[.][0-9]+[.][0-9]+)[+]([0-9]+)$ ]]; then
            echo "Invalid pubspec.yaml version: $version_line (expected MAJOR.MINOR.PATCH+BUILD)" >&2
            exit 1
          fi
          version="${BASH_REMATCH[1]}"
          build_number="${BASH_REMATCH[2]}"
          filename="BYD-Smart-Launcher-v${version}-build${build_number}-debug-${GITHUB_SHA:0:8}.apk"
          cp "$apk" "build/app/outputs/flutter-apk/$filename"
          (cd build/app/outputs/flutter-apk && sha256sum "$filename" > SHA256SUMS.txt)
      - name: Upload parked diagnostics debug APK + SHA256
        uses: actions/upload-artifact@v4
        with:
          name: byd-smart-launcher-parked-test
          path: |
            build/app/outputs/flutter-apk/BYD-Smart-Launcher-v*-build*-debug-*.apk
            build/app/outputs/flutter-apk/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release(test-apk):')
    needs: flutter
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: byd-smart-launcher-parked-test
          path: release
      - name: Verify and publish explicitly marked parking-test prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd release
          sha256sum -c SHA256SUMS.txt
          tag="parking-test-${GITHUB_SHA:0:8}"
          files=(BYD-Smart-Launcher-v*-build*-debug-*.apk)
          if (( ${#files[@]} != 1 )) || [[ ! -f "${files[0]}" ]]; then
            echo "Expected exactly one versioned APK in release artifact" >&2
            exit 1
          fi
          gh release create "$tag" \
            "${files[0]}" \
            SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "BYD Smart Launcher - ${files[0]}" \
            --notes "Developer debug-signed diagnostic APK only. NOT an accepted production launcher. Do not set as the OEM HOME app. Unverified firmware/FIDs, camera/automation dispatch and vehicle controls remain disabled. Test only while parked and keep the factory launcher available." \
            --prerelease
