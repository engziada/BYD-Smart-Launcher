name: Flutter and Android checks
on:
  push:
  pull_request:
jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Generate missing standard Android wrapper files
        run: flutter create --platforms=android --project-name byd_smart_launcher --org com.ziada .
      - name: Compile Android debug APK (not production)
        run: flutter build apk --debug
